# ===============================
# TinyIM 应用配置
# ===============================
spring.application.name=TinyIM
server.port=8080

# ===============================
# WebSocket 配置
# ===============================
im.websocket.port=8081
im.websocket.path=/ws

# 心跳配置（单位：秒）
im.heartbeat.readerIdleTime=60
im.heartbeat.writerIdleTime=0
im.heartbeat.allIdleTime=0

# ===============================
# MySQL 数据库配置
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/tinyim?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# MyBatis Plus 配置
# ===============================
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.tinyim.entity
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===============================
# Redis 配置
# ===============================
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# Redisson 配置
spring.redisson.address=redis://localhost:6379

# ===============================
# RocketMQ 配置
# ===============================
rocketmq.name-server=localhost:9876
rocketmq.producer.group=im-producer-group
im.mq.topic=message-topic
im.mq.consumer.group=message-consumer-group

# ===============================
# 日志配置
# ===============================
logging.level.com.tinyim=INFO
logging.level.io.netty=WARN
